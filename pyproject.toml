[project]
name = "crispr-preflight"
version = "0.1.0"
description = "Pre-experiment biological flight check for CRISPR knockout, CRISPRi, and target validation experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Mulham Najajreh" }
]
keywords = [
    "crispr",
    "functional-genomics",
    "bioinformatics",
    "target-validation",
    "nonsense-mediated-decay",
    "depmap",
    "paralog",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://mulhamnajajreh.com"
Repository = "https://github.com/MulhamNajajreh/crispr-preflight"

[project.scripts]
crispr-preflight = "crispr_preflight.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
